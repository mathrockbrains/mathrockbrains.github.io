function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}return AC}
function unlock(){const a=ac();if(!a)return;musicOn=true;try{if(a.state!=='running')a.resume();const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}catch(e){}}
function tone(f,d,type,vol,sl,when){const a=ac();if(!a||muted||a.state!=='running')return;const o=a.createOscillator(),gn=a.createGain(),t0=Math.max(when||0,a.currentTime);o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+sl),t0+d);gn.gain.setValueAtTime(vol||.1,t0);gn.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(gn);gn.connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(d,vol){const a=ac();if(!a||muted||a.state!=='running')return;const n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),dt=b.getChannelData(0);for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),gn=a.createGain();s.buffer=b;gn.gain.value=vol||.2;s.connect(gn);gn.connect(a.destination);s.start()}

 special:()=>{tone(100,.8,'sawtooth',.18,1200);noise(.6,.2)},kill:()=>{tone(600,.2,'square',.1,-450);noise(.2,.15)},wave:()=>[0,.12,.24].forEach((d,i)=>tone([440,554,659][i],.15,'square',.08,0,ac().currentTime+d)),over:()=>tone(300,1.2,'sawtooth',.2,-260)};

  tone(n,.2,'sawtooth',.07,0,nextT);if(i%2==0)tone(n*2,.1,'square',.03,0,nextT);
  tone(ARP[i]*(bar%2?1.2:1),.12,'square',.035,0,nextT);if(i%4==0)tone(120,.12,'sine',.25,-80,nextT);step++;nextT+=.16}}
